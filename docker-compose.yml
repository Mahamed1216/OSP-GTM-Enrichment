# Local testing only. Real secrets live in a local .env (git-ignored, NOT
# committed and NOT baked into the image). In AWS, inject env vars via
# Secrets Manager / SSM Parameter Store instead of env_file.
#
# Build once, run any mode:
#   docker compose build
#   docker compose up streamlit          # internal/admin UI on :8501
#   docker compose up api                # internal API on :8000
#   docker compose up webhook            # Instantly webhook on :8001
#   docker compose run --rm scheduler        # one-shot lead source scheduler
#   docker compose run --rm worker           # one-shot API async worker
#   docker compose run --rm salesos-worker   # one-shot SalesOS processing worker
#   docker compose run --rm salesos-send     # one-shot SalesOS approved-send worker
#
# SalesOS integration mode (primary production model) needs SALESOS_INTEGRATION_MODE=true
# in .env and a DATABASE_URL pointing at the shared SalesOS Supabase.
services:
  streamlit:
    build: .
    image: osp-gtm-enrichment:local
    env_file: .env
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "app/main.py", "--server.port=8501", "--server.address=0.0.0.0"]

  api:
    image: osp-gtm-enrichment:local
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    command: ["uvicorn", "src.api.server:app", "--host", "0.0.0.0", "--port", "8000"]

  webhook:
    image: osp-gtm-enrichment:local
    build: .
    env_file: .env
    ports:
      - "8001:8001"
    command: ["uvicorn", "src.webhook.server:app", "--host", "0.0.0.0", "--port", "8001"]

  scheduler:
    image: osp-gtm-enrichment:local
    build: .
    env_file: .env
    command: ["python", "-m", "src.lead_source.scheduler"]

  worker:
    image: osp-gtm-enrichment:local
    build: .
    env_file: .env
    command: ["python", "-m", "src.api.worker"]

  # SalesOS shared-Supabase integration workers (set SALESOS_INTEGRATION_MODE=true).
  salesos-worker:
    image: osp-gtm-enrichment:local
    build: .
    env_file: .env
    command: ["python", "-m", "src.integrations.salesos.worker", "--once", "--limit", "10"]

  salesos-send:
    image: osp-gtm-enrichment:local
    build: .
    env_file: .env
    command: ["python", "-m", "src.integrations.salesos.send_approved", "--once", "--limit", "10"]
