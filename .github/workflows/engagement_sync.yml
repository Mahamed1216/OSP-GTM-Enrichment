name: Daily Campaign Analytics Sync

on:
  schedule:
    # Weekdays at 9 AM Eastern. Two crons cover DST without doubling up
    # the actual work — the sync script is idempotent, and only one of
    # the two will land at local 9 AM in any given month.
    - cron: '0 13 * * 1-5'   # 13:00 UTC = 9 AM EDT (Mar–Nov)
    - cron: '0 14 * * 1-5'   # 14:00 UTC = 9 AM EST (Nov–Mar)
  workflow_dispatch:
    # Manual trigger from the Actions tab. Useful when re-running after
    # changing INSTANTLY_API_KEY / INSTANTLY_CAMPAIGN_ID secrets.

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run campaign analytics sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
          INSTANTLY_CAMPAIGN_ID: ${{ secrets.INSTANTLY_CAMPAIGN_ID }}
          # ANTHROPIC_API_KEY is only used by the optional ratings rollup
          # step at the end of the script — non-fatal if missing.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/sync_instantly_campaign_analytics.py
