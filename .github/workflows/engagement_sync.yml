name: Daily Engagement Sync

on:
  schedule:
    - cron: '0 12 * * 1-5'
    # 12:00 UTC = 8:00 AM EDT (UTC-4, May–Nov).
    # When clocks change to EST (UTC-5, Nov–Mar), update to '0 13 * * 1-5'.
  workflow_dispatch:
    # Allows manual trigger from the Actions tab at any time.

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run engagement sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
          INSTANTLY_CAMPAIGN_ID: ${{ secrets.INSTANTLY_CAMPAIGN_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/pull_engagement.py
