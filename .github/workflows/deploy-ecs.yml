# Build the Docker image, push it to Amazon ECR, and deploy to the ECS
# "staging" cluster on every push to main.
#
# Secrets are NEVER committed: AWS credentials come from GitHub Actions secrets,
# and app secrets are injected at runtime by ECS from AWS Secrets Manager (see
# aws/ecs-task-definition-api.json + the "AWS ECS/ECR Deployment" README section).
#
# This workflow does NOT create AWS resources. The ECR repository, ECS cluster,
# ECS service, task roles, and CloudWatch log group must already exist (one-time
# setup — see README). To create the ECR repo:
#   aws ecr create-repository --repository-name osp-gtm-enrichment --region us-east-2
name: Deploy API to ECS (staging)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    # Manual trigger from the Actions tab (re-deploy without a new commit).

# Don't let two deploys race the same service.
concurrency:
  group: deploy-ecs-staging
  cancel-in-progress: false

env:
  # Default region is us-east-2; the AWS_REGION secret overrides it if set.
  AWS_REGION: us-east-2
  ECR_REPOSITORY: osp-gtm-enrichment
  ECS_CLUSTER: staging
  ECS_SERVICE: osp-gtm-api-service-ypivw3fk          # change here if the real ECS service name differs
  ECS_TASK_DEFINITION: aws/ecs-task-definition-api.json
  CONTAINER_NAME: osp-gtm-api

jobs:
  deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Use the AWS_REGION secret when provided; otherwise default to us-east-2.
          aws-region: ${{ secrets.AWS_REGION || env.AWS_REGION }}

      # Create the ECR repository on first deploy if it doesn't exist yet, so the
      # push below can't fail with "repository ... does not exist". Idempotent:
      # describe succeeds on later runs and create is skipped. If create fails on
      # permissions, the AWS error surfaces and the step fails loudly so the repo
      # can be granted ecr:CreateRepository or created manually.
      # $AWS_REGION here is the region exported by configure-aws-credentials
      # (the AWS_REGION secret if set, else the us-east-2 workflow default).
      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "$ECR_REPOSITORY" --region "$AWS_REGION"

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Render ECS task definition with the new image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to Amazon ECS
        id: deploy-ecs
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      # When the deploy above fails or times out, the rollout started but the
      # service never stabilized. The waiter error alone doesn't say WHY, so dump
      # the ECS service events, the stopped-task stop reasons / container exit
      # codes, and recent container logs. set +e keeps every probe running even if
      # an individual AWS call fails. This step does NOT mask the failure — the
      # job stays red because the deploy step already failed.
      - name: ECS failure diagnostics
        if: failure()
        run: |
          set +e

          echo "::group::ECS service description"
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"
          echo "::endgroup::"

          echo "::group::Latest ECS service events (most recent 10)"
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query "services[0].events[0:10].[createdAt,message]" \
            --output table
          echo "::endgroup::"

          echo "::group::Stopped task ARNs"
          aws ecs list-tasks \
            --cluster "$ECS_CLUSTER" \
            --service-name "$ECS_SERVICE" \
            --desired-status STOPPED \
            --region "$AWS_REGION" \
            --max-results 10
          echo "::endgroup::"

          echo "::group::Stopped task details (stop reason + container exit codes)"
          TASKS=$(aws ecs list-tasks --cluster "$ECS_CLUSTER" --service-name "$ECS_SERVICE" --desired-status STOPPED --region "$AWS_REGION" --query "taskArns[]" --output text)
          if [ -n "$TASKS" ]; then
            aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks $TASKS \
              --region "$AWS_REGION" \
              --query "tasks[].{stoppedReason:stoppedReason,stopCode:stopCode,containers:containers[].{name:name,lastStatus:lastStatus,exitCode:exitCode,reason:reason,logStreamName:logStreamName}}" \
              --output json
          else
            echo "No stopped tasks found for $ECS_SERVICE."
          fi
          echo "::endgroup::"

          echo "::group::Recent CloudWatch logs (/ecs/osp-gtm-api, last 30m)"
          aws logs tail "/ecs/osp-gtm-api" \
            --region "$AWS_REGION" \
            --since 30m \
            || true
          echo "::endgroup::"
